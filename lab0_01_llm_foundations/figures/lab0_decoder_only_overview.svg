<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="2070" viewBox="0 0 760 1140" role="img" aria-labelledby="title desc">
<title id="title">The Notebook’s Tiny Decoder-Only Transformer</title>
<desc id="desc">Token IDs are mapped to token embeddings, which are added to position embeddings. Two Transformer blocks each use masked multi-head self-attention with four heads to combine information across token positions, followed by a position-wise feed-forward network that transforms each token independently. Final layer normalization and an output layer produce vocabulary scores at each position. During generation, scores at the last position are used to select the next token. Within-block normalization, residual connections, and dropout are omitted for clarity.</desc>
<defs>
<style>
.title { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #172b4d; }
.label { font: 600 20px 'Segoe UI', Arial, sans-serif; fill: #172b4d; }
.text { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #334155; }
.small { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
.arrow { fill: none; stroke: #64748b; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
</defs>
<rect width="760" height="1140" fill="#ffffff"/>
<rect x="40" y="28" width="42" height="5" rx="2.5" fill="#3b6ea8"/>
<text x="40" y="66" text-anchor="start" class="title">The Notebook’s Tiny Decoder-Only Transformer</text>
<text x="40" y="95" text-anchor="start" class="small">From token IDs to next-token scores</text>
<rect x="80" y="125" width="260" height="48" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="210" y="156" text-anchor="middle" class="label">Token IDs</text>
<path d="M 210 179 V 197" class="arrow"/>
<rect x="80" y="208" width="260" height="62" rx="12" fill="#eff6ff" stroke="#b8cde6" stroke-width="1.5"/>
<text x="210" y="245" text-anchor="middle" class="label">Token embeddings</text>
<rect x="420" y="208" width="260" height="62" rx="12" fill="#eff6ff" stroke="#b8cde6" stroke-width="1.5"/>
<text x="550" y="245" text-anchor="middle" class="label">Position embeddings</text>
<path d="M 210 276 V 304 H 353" class="arrow"/>
<path d="M 550 276 V 304 H 407" class="arrow"/>
<circle cx="380" cy="304" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><path d="M 371 304 H 389 M 380 295 V 313" stroke="#475569" stroke-width="2"/>
<text x="380" y="345" text-anchor="middle" class="small">Add token and position embeddings</text>
<path d="M 380 354 V 375" class="arrow"/>
<rect x="40" y="388" width="680" height="332" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="66" y="425" text-anchor="start" class="label">Transformer block</text>
<rect x="575" y="402" width="119" height="33" rx="16" fill="#e2eaf5" stroke="#e2eaf5" stroke-width="1.5"/>
<text x="634.5" y="425" text-anchor="middle" class="small">Repeat × 2</text>
<rect x="66" y="453" width="628" height="140" rx="12" fill="#edf4fd" stroke="#b8cde6" stroke-width="1.5"/>
<text x="380" y="488" text-anchor="middle" class="label">Masked multi-head self-attention</text>
<text x="380" y="518" text-anchor="middle" class="text">4 heads</text>
<text x="380" y="549" text-anchor="middle" class="small">Combines information across allowed token positions</text>
<text x="380" y="575" text-anchor="middle" class="small">Context: earlier tokens and the token itself</text>
<path d="M 380 599 V 618" class="arrow"/>
<rect x="66" y="632" width="628" height="65" rx="12" fill="#eef7f5" stroke="#b5d6ce" stroke-width="1.5"/>
<text x="380" y="659" text-anchor="middle" class="label">Position-wise feed-forward network (FFN)</text>
<text x="380" y="684" text-anchor="middle" class="small">Transforms each token independently</text>
<path d="M 380 726 V 747" class="arrow"/>
<rect x="80" y="760" width="600" height="52" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="380" y="792" text-anchor="middle" class="label">Final layer normalization</text>
<path d="M 380 818 V 839" class="arrow"/>
<rect x="80" y="852" width="600" height="52" rx="12" fill="#eff6ff" stroke="#b8cde6" stroke-width="1.5"/>
<text x="380" y="884" text-anchor="middle" class="label">Output layer</text>
<path d="M 380 910 V 931" class="arrow"/>
<rect x="80" y="944" width="600" height="76" rx="12" fill="#eef7f5" stroke="#b5d6ce" stroke-width="1.5"/>
<text x="380" y="974" text-anchor="middle" class="label">Vocabulary scores</text>
<text x="380" y="1002" text-anchor="middle" class="small">One score per vocabulary token at each position</text>
<text x="40" y="1054" text-anchor="start" class="small">Generation uses the last position’s scores to select the next token.</text>
<text x="40" y="1090" text-anchor="start" class="small">Within-block normalization, residual connections, and dropout</text>
<text x="40" y="1114" text-anchor="start" class="small">are omitted for clarity.</text>
</svg>
