<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">First AgentScope agent workflow</title>
  <desc id="desc">A user message enters an agent configured with instructions and a chat model, and the agent returns an assistant message. No tools are registered in this lesson.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/></marker>
    <style>.label { font: 600 18px Arial, sans-serif; fill: #101828; } .small { font: 15px Arial, sans-serif; fill: #475467; } .box { stroke-width: 2; rx: 14; }</style>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <rect class="box" x="35" y="102" width="175" height="96" fill="#eff8ff" stroke="#2e90fa"/>
  <text class="label" x="122" y="142" text-anchor="middle">User message</text><text class="small" x="122" y="169" text-anchor="middle">Msg(role=&quot;user&quot;)</text>
  <line x1="210" y1="150" x2="290" y2="150" stroke="#344054" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="box" x="295" y="40" width="310" height="220" fill="#f9f5ff" stroke="#9e77ed"/>
  <text class="label" x="450" y="78" text-anchor="middle">Agent</text><line x1="325" y1="95" x2="575" y2="95" stroke="#d0d5dd" stroke-width="1"/>
  <rect class="box" x="325" y="112" width="250" height="34" fill="#ffffff" stroke="#d0d5dd"/><text class="small" x="450" y="135" text-anchor="middle">System prompt</text>
  <rect class="box" x="325" y="157" width="250" height="34" fill="#ffffff" stroke="#d0d5dd"/><text class="small" x="450" y="180" text-anchor="middle">Chat model: qwen3:8b</text>
  <rect class="box" x="325" y="202" width="250" height="34" fill="#ffffff" stroke="#d0d5dd"/><text class="small" x="450" y="225" text-anchor="middle">ReActConfig(max_iters=3)</text>
  <line x1="605" y1="150" x2="685" y2="150" stroke="#344054" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="box" x="690" y="102" width="175" height="96" fill="#ecfdf3" stroke="#12b76a"/>
  <text class="label" x="778" y="142" text-anchor="middle">Assistant message</text><text class="small" x="778" y="169" text-anchor="middle">Msg(role=&quot;assistant&quot;)</text>
  <text class="small" x="450" y="286" text-anchor="middle">Lesson 02: no tools registered yet</text>
</svg>
