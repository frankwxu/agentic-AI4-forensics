<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc">
  <title id="title">Sequential specialist handoff</title>
  <desc id="desc">The original practice case goes to a network specialist. Its finding becomes an explicit handoff message. The evidence reviewer receives both the original case and the handoff, then returns an evidence review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#344054"/></marker>
    <style>.box{stroke-width:2;rx:14}.title{font:600 18px Arial,sans-serif;fill:#101828}.body{font:14px Arial,sans-serif;fill:#475467}.label{font:600 13px Arial,sans-serif;fill:#344054}</style>
  </defs>
  <rect width="1100" height="410" fill="#ffffff"/>
  <text class="body" x="550" y="34" text-anchor="middle">The handoff is explicit: it is a message created by the notebook, not automatically shared agent memory.</text>
  <circle cx="48" cy="70" r="7" fill="#9e77ed"/><path d="M36 87Q48 75 60 87" fill="none" stroke="#9e77ed" stroke-width="3" stroke-linecap="round"/>
  <text class="label" x="70" y="76">Agents</text>
  <rect x="150" y="59" width="16" height="21" rx="2" fill="#eff8ff" stroke="#2e90fa" stroke-width="2"/><path d="M162 59V66H166" fill="none" stroke="#2e90fa" stroke-width="2"/>
  <text class="label" x="176" y="76">Data and messages</text>

  <rect class="box" x="35" y="150" width="190" height="105" fill="#eff8ff" stroke="#2e90fa"/>
  <text class="title" x="130" y="188" text-anchor="middle">Original case</text>
  <text class="body" x="130" y="214" text-anchor="middle">alert + local record</text>
  <text class="body" x="130" y="235" text-anchor="middle">+ known limits</text>
  <rect x="192" y="162" width="18" height="24" rx="2" fill="#ffffff" stroke="#2e90fa" stroke-width="2"/>
  <path d="M204 162V169H210M196 175H206M196 180H206" fill="none" stroke="#2e90fa" stroke-width="1.5"/>

  <rect class="box" x="330" y="100" width="210" height="130" fill="#f9f5ff" stroke="#9e77ed"/>
  <text class="title" x="420" y="139" text-anchor="middle">Network specialist</text>
  <text class="body" x="420" y="166" text-anchor="middle">reports what the alert</text>
  <text class="body" x="420" y="187" text-anchor="middle">observed and cannot show</text>
  <circle cx="510" cy="122" r="7" fill="#9e77ed"/><path d="M498 140Q510 128 522 140" fill="none" stroke="#9e77ed" stroke-width="3" stroke-linecap="round"/>

  <rect class="box" x="645" y="85" width="190" height="105" fill="#fffaeb" stroke="#f79009"/>
  <text class="title" x="740" y="123" text-anchor="middle">network_handoff</text>
  <text class="body" x="740" y="150" text-anchor="middle">labeled Msg containing</text>
  <text class="body" x="740" y="171" text-anchor="middle">the network finding</text>
  <rect x="801" y="97" width="18" height="24" rx="2" fill="#ffffff" stroke="#f79009" stroke-width="2"/>
  <path d="M813 97V104H819M805 110H815M805 115H815" fill="none" stroke="#f79009" stroke-width="1.5"/>

  <rect class="box" x="865" y="200" width="205" height="130" fill="#f9f5ff" stroke="#9e77ed"/>
  <text class="title" x="950" y="238" text-anchor="middle">Evidence reviewer</text>
  <text class="body" x="950" y="265" text-anchor="middle">checks original case +</text>
  <text class="body" x="950" y="286" text-anchor="middle">handoff; names next evidence</text>
  <circle cx="1040" cy="222" r="7" fill="#9e77ed"/><path d="M1028 240Q1040 228 1052 240" fill="none" stroke="#9e77ed" stroke-width="3" stroke-linecap="round"/>

  <rect class="box" x="865" y="55" width="205" height="75" fill="#ecfdf3" stroke="#12b76a"/>
  <text class="title" x="967" y="85" text-anchor="middle">Evidence review</text>
  <text class="body" x="967" y="108" text-anchor="middle">facts, gaps, next item</text>
  <rect x="1034" y="65" width="18" height="24" rx="2" fill="#ffffff" stroke="#12b76a" stroke-width="2"/>
  <path d="M1046 65V72H1052M1038 78H1048M1038 83H1048" fill="none" stroke="#12b76a" stroke-width="1.5"/>

  <path d="M225 180H330" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label" x="278" y="169" text-anchor="middle">first request</text>
  <path d="M540 150H645" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label" x="593" y="139" text-anchor="middle">finding</text>
  <path d="M835 137C865 137 850 245 865 245" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label" x="846" y="186" text-anchor="middle">handoff</text>
  <path d="M225 228C500 385 790 355 875 303" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="label" x="570" y="367" text-anchor="middle">original case is included again so the reviewer can check the report</text>
  <path d="M967 200V130" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
