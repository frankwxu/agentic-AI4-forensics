<text x="1070" y="836" text-anchor="middle" class="tiny">Devices / IoT</text>

<!-- Loop -->
<rect x="220" y="878" width="1085" height="116" rx="16" fill="#fff" stroke="#8f6bc1" stroke-dasharray="7 6" stroke-width="1.5"/>
<text x="762" y="904" text-anchor="middle" class="purple">AGENT LOOP (THOUGHT–ACTION–OBSERVATION)</text>

<rect x="280" y="922" width="190" height="54" rx="12" fill="#fbf8ff" stroke="#a98bd0"/><circle cx="278" cy="937" r="14" fill="#6d3bb4"/><text x="278" y="942" text-anchor="middle" font-size="14" font-family="Arial" fill="#fff" font-weight="700">1</text><text x="375" y="942" text-anchor="middle" class="head">REASON / PLAN</text><text x="375" y="964" text-anchor="middle" class="tiny">Think, reason, decide.</text>
<line x1="470" y1="949" x2="535" y2="949" stroke="#6d3bb4" stroke-width="2.5" marker-end="url(#ap)"/>
<rect x="558" y="922" width="190" height="54" rx="12" fill="#fbf8ff" stroke="#a98bd0"/><circle cx="556" cy="937" r="14" fill="#6d3bb4"/><text x="556" y="942" text-anchor="middle" font-size="14" font-family="Arial" fill="#fff" font-weight="700">2</text><text x="653" y="942" text-anchor="middle" class="head">ACT (USE TOOLS)</text><text x="653" y="964" text-anchor="middle" class="tiny">Select a tool/capability.</text>
<line x1="748" y1="949" x2="813" y2="949" stroke="#6d3bb4" stroke-width="2.5" marker-end="url(#ap)"/>
<rect x="836" y="922" width="190" height="54" rx="12" fill="#fbf8ff" stroke="#a98bd0"/><circle cx="834" cy="937" r="14" fill="#6d3bb4"/><text x="834" y="942" text-anchor="middle" font-size="14" font-family="Arial" fill="#fff" font-weight="700">3</text><text x="931" y="942" text-anchor="middle" class="head">OBSERVE RESULTS</text><text x="931" y="964" text-anchor="middle" class="tiny">Environment returns results.</text>
<line x1="1026" y1="949" x2="1080" y2="949" stroke="#6d3bb4" stroke-width="2.5" marker-end="url(#ap)"/><circle cx="1123" cy="949" r="26" fill="none" stroke="#6d3bb4" stroke-width="4" stroke-dasharray="12 8"/>
<text x="1168" y="940" class="small">Repeat until</text><text x="1168" y="961" class="small">goal is achieved.</text>
