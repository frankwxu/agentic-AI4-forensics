<text x="1340" y="564" class="small">• Messages sent</text><text x="1340" y="587" class="small">• System changes</text><text x="1340" y="610" class="small">• Completed actions</text>

<!-- Brain -->
<rect x="340" y="142" width="840" height="145" rx="18" fill="#f7fbff" stroke="#1f66c1" stroke-width="2"/>

<g stroke="#1f66c1" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
