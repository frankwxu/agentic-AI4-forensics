  <line x1="426" y1="230" x2="432" y2="230"/>
</g>
<text x="474" y="180" class="blue">1. BRAIN (REASONING ENGINE)</text>
<text x="474" y="215" class="body">The agent’s “brain” uses an AI model (e.g., LLM) to</text>
<text x="474" y="238" class="body">understand inputs, reason, plan, and decide what to do next.</text>
<text x="910" y="174" class="body">• Understand inputs</text>
<text x="910" y="204" class="body">• Reason about goals &amp; context</text>
<text x="910" y="234" class="body">• Plan steps</text>
<text x="910" y="264" class="body">• Select next action</text>

<!-- Memory -->
<rect x="340" y="309" width="840" height="158" rx="18" fill="#fbfffb" stroke="#168847" stroke-width="2"/>

<g stroke="#168847" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="399" cy="350" rx="28" ry="9"/>
  <path d="M371 350v46c0 5 13 9 28 9s28-4 28-9v-46"/>
  <path d="M371 365c0 5 13 9 28 9s28-4 28-9"/>
  <path d="M371 381c0 5 13 9 28 9s28-4 28-9"/>
</g>
<text x="474" y="355" class="green">2. MEMORY</text>
<text x="474" y="390" class="body">Stores information the agent can use</text><text x="474" y="413" class="body">now or in the future.</text>

<text x="760" y="337" class="small">• <tspan font-weight="700">Short-term / context memory</tspan></text>
<text x="779" y="357" class="tiny">(conversation history, recent observations)</text>
<text x="760" y="386" class="small">• <tspan font-weight="700">Working memory</tspan></text>
<text x="779" y="406" class="tiny">(intermediate results, notes)</text>
<text x="760" y="435" class="small">• <tspan font-weight="700">Long-term memory</tspan></text>
<text x="779" y="455" class="tiny">(vector DB, databases, files, knowledge base)</text>

<!-- Tools -->
<rect x="340" y="487" width="840" height="168" rx="18" fill="#fffaf5" stroke="#e87500" stroke-width="2"/>

<g stroke="#e87500" stroke-width="2.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="401" cy="563" r="12"/>
  <circle cx="401" cy="563" r="4"/>
  <path d="M401 539v8M401 579v8M377 563h8M417 563h8M384 546l6 6M412 574l6 6M384 580l6-6M412 552l6-6"/>
</g>
<text x="474" y="528" class="orange">3. TOOLS / CAPABILITIES</text><text x="474" y="554" class="orange">(THE BODY)</text>
<text x="474" y="591" class="body">Provides the agent with abilities</text><text x="474" y="614" class="body">to interact with the outside world.</text>

<text x="748" y="518" class="small">• <tspan font-weight="700">Retrieval / Search</tspan> (web, docs, knowledge bases)</text>
<text x="748" y="546" class="small">• <tspan font-weight="700">Code execution</tspan> (run code, calculations)</text>
<text x="748" y="574" class="small">• <tspan font-weight="700">APIs &amp; Services</tspan> (external APIs, platforms)</text>
<text x="748" y="602" class="small">• <tspan font-weight="700">External actions</tspan> (send email, control systems, etc.)</text>
<text x="748" y="630" class="small">• <tspan font-weight="700">File &amp; data operations</tspan> (read/write files, process data)</text>

<!-- Environment -->
<line x1="748" y1="672" x2="748" y2="713" stroke="#6d3bb4" stroke-width="2.5" marker-start="url(#aps)" marker-end="url(#ap)"/>
<rect x="315" y="716" width="890" height="134" rx="18" fill="#fcf9ff" stroke="#6d3bb4" stroke-width="2"/>
