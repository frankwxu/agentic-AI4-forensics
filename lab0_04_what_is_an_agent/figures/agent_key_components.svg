<text x="108" y="489" class="small">(messages,</text><text x="108" y="508" class="small">observations)</text>


<g stroke="#e87500" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M57 562h25l10 10v35H57z"/>
