    .purple{font:700 20px Arial,Helvetica,sans-serif;fill:#6d3bb4}
    .head{font:700 17px Arial,Helvetica,sans-serif;fill:#111}
    .body{font:15px Arial,Helvetica,sans-serif;fill:#111}
    .small{font:13.5px Arial,Helvetica,sans-serif;fill:#111}
    .tiny{font:12px Arial,Helvetica,sans-serif;fill:#111}
  </style>
  <marker id="ab" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f66c1"/></marker>
